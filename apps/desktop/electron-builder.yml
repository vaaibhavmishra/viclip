appId: com.viclip.app
productName: ViClip
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
extraMetadata:
  name: ViClip
  description: Sync Your Clipboard Across All Your Devices
  homepage: https://viclip.shipby.me
  author:
    name: Vaibhav Mishra
    email: vaibhav@shipby.me
directories:
  buildResources: build
  output: "dist/v${version}/${os}-${arch}"
publish:
  provider: github
  owner: vaaibhavmishra
  repo: viclip
files:
  - "out/**"
  - "resources/**"
  - "package.json"
  - "!**/.vscode/*"
  - "!src/*"
  - "!electron.vite.config.{js,ts,mjs,cjs}"
  - "!{.eslintignore, .eslintrc.cjs, .prettierignore, .prettierrc.yaml, .npmrc, .eslintcache, .editorconfig, biome.json}"
  - "!{.env, .env.*}"
  - "!{pnpm-lock.yaml, pnpm-workspace.yaml}"
  - "!{tsconfig.json, tsconfig.node.json, tsconfig.web.json}"
  - "!{dev-app-update.yml}"
  - "!{CHANGELOG.md, README.md, LICENSE.txt}"
  - "!**/*.map"
asarUnpack:
  - resources/**
win:
  executableName: ViClip
  legalTrademarks: "ViClip"
  icon: build/icon.ico
  signAndEditExecutable: true
  verifyUpdateCodeSignature: true
nsis:
  artifactName: ${name}-${version}-${os}-${arch}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  deleteAppDataOnUninstall: false
mac:
  target:
    - dmg
    - zip
  icon: build/icon.icns
  minimumSystemVersion: "13.0"
  entitlements: resources/entitlements.mac.plist
  identity: null
  notarize: false
dmg:
  artifactName: ${name}-${version}-${os}-${arch}.${ext}
linux:
  target:
    - AppImage
  maintainer: Vaibhav-Mishra
  category: Utility
appImage:
  artifactName: ${name}-${version}-${os}-${arch}.${ext}
npmRebuild: false
